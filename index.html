
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos Ângulos - MediaPipe Hands</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #111827; color: white; font-family: 'Inter', sans-serif; }
        .canvas-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #output_canvas {
            transform: scaleX(-1); /* Espelha a câmera para ficar como um espelho */
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        
        /* Animações customizadas */
        @keyframes pulse-border {
            0% { border-color: rgba(255, 255, 255, 0.2); }
            50% { border-color: rgba(255, 255, 255, 0.8); }
            100% { border-color: rgba(255, 255, 255, 0.2); }
        }
        .anim-pulse-border { animation: pulse-border 2s infinite; border: 4px solid transparent; }
        
        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: pop-in 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row p-4 gap-4 bg-gray-900">

    <!-- Painel Lateral -->
    <div class="w-full md:w-1/3 lg:w-1/4 bg-gray-800 rounded-2xl p-6 flex flex-col shadow-2xl z-10 border border-gray-700">
        <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
            Jogo dos Ângulos
        </h1>
        <p class="text-gray-400 text-sm mb-6">Abra a mão (polegar e mindinho) para reproduzir a abertura solicitada.</p>

        <!-- Status de Carregamento -->
        <div id="loading" class="flex flex-col items-center justify-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-blue-400 font-semibold">Iniciando câmera e IA...</p>
        </div>

        <!-- Área de Jogo (Oculta até carregar) -->
        <div id="game-area" class="hidden flex-col items-center flex-grow">
            
            <div class="bg-gray-900 p-4 rounded-xl w-full text-center mb-6 border border-gray-700 shadow-inner">
                <p class="text-gray-400 text-sm uppercase tracking-wider mb-1">Alvo atual</p>
                <h2 id="target-name" class="text-3xl font-bold mb-2">-</h2>
                <div class="flex justify-center items-center gap-2">
                    <span class="text-xl text-gray-500">Abertura:</span>
                    <span id="target-angle-text" class="text-4xl font-mono font-bold text-white">0°</span>
                </div>
            </div>

            <!-- Canvas para desenhar o alvo visualmente -->
            <div class="relative w-48 h-48 mb-8">
                <canvas id="target_canvas" width="200" height="200" class="w-full h-full bg-gray-800 rounded-full border-4 border-gray-700 shadow-lg"></canvas>
            </div>

            <!-- Feedback de Sucesso -->
            <div id="success-message" class="hidden w-full bg-green-500/20 border border-green-500 rounded-xl p-4 text-center pop-in mt-auto">
                <p class="text-green-400 font-bold text-xl mb-1">Excelente!</p>
                <p class="text-green-200 text-sm">Ângulo alcançado. Preparando próximo...</p>
            </div>
            
            <!-- Barra de Progresso de captura -->
            <div class="w-full h-3 bg-gray-700 rounded-full mt-4 overflow-hidden">
                <div id="hold-progress" class="h-full bg-blue-500 w-0 transition-all duration-100 ease-linear"></div>
            </div>
        </div>
    </div>

    <!-- Câmera e Overlay -->
    <div class="w-full md:w-2/3 lg:w-3/4 bg-black rounded-2xl relative overflow-hidden anim-pulse-border flex-grow">
        <video id="input_video" class="hidden"></video>
        <canvas id="output_canvas"></canvas>
        
        <!-- HUD Overlay na câmera -->
        <div class="absolute top-6 left-6 bg-black/60 backdrop-blur-md px-6 py-4 rounded-xl border border-gray-600/50 shadow-xl pointer-events-none">
            <p class="text-gray-300 text-sm mb-1 uppercase tracking-wide">Sua Mão</p>
            <div class="flex items-baseline gap-2">
                <span id="current-angle" class="text-5xl font-mono font-bold text-white">--°</span>
            </div>
            <p id="current-class" class="text-lg font-semibold mt-1">Detectando...</p>
        </div>
        
        <!-- Instrução flutuante -->
        <div id="camera-hint" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-500/80 backdrop-blur px-4 py-2 rounded-full text-white text-sm font-medium">
            Use o Polegar e o Mindinho
        </div>
    </div>

    <script>
        // Elementos DOM
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const targetCanvas = document.getElementById('target_canvas');
        const targetCtx = targetCanvas.getContext('2d');
        
        const uiElements = {
            loading: document.getElementById('loading'),
            gameArea: document.getElementById('game-area'),
            targetName: document.getElementById('target-name'),
            targetAngleText: document.getElementById('target-angle-text'),
            currentAngle: document.getElementById('current-angle'),
            currentClass: document.getElementById('current-class'),
            holdProgress: document.getElementById('hold-progress'),
            successMessage: document.getElementById('success-message'),
            cameraHint: document.getElementById('camera-hint')
        };

        // Definição das classes de ângulos
        const ANGLE_CLASSES = {
            ACUTE: { id: 'acute', name: 'Agudo', min: 15, max: 80, color: '#0ea5e9', tailwind: 'text-sky-500' },     // Azul
            RIGHT: { id: 'right', name: 'Reto', min: 80, max: 100, color: '#84cc16', tailwind: 'text-lime-500' },    // Verde
            OBTUSE: { id: 'obtuse', name: 'Obtuso', min: 100, max: 150, color: '#f59e0b', tailwind: 'text-amber-500' },// Laranja
            STRAIGHT: { id: 'straight', name: 'Raso', min: 150, max: 180, color: '#ef4444', tailwind: 'text-red-500' } // Vermelho
        };

        // Estado do Jogo
        let gameState = {
            currentTarget: null,
            targetAngleValue: 0,
            holdFrames: 0,
            requiredHoldFrames: 30, // Cerca de 1 segundo a 30fps
            isPaused: false,
            tolerance: 12 // +/- 12 graus de tolerância
        };

        // Função para calcular ângulo entre 3 pontos (p1 = polegar, p2 = pulso(vértice), p3 = mindinho)
        function calculateAngle(p1, p2, p3) {
            const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
            const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
            
            const dot = v1.x * v2.x + v1.y * v2.y;
            const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
            const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
            
            // Evitar divisão por zero
            if (mag1 * mag2 === 0) return 0;
            
            let angleRad = Math.acos(Math.max(-1, Math.min(1, dot / (mag1 * mag2))));
            return Math.round(angleRad * (180 / Math.PI));
        }

        // Classificar o ângulo atual
        function classifyAngle(angle) {
            if (angle < 85) return ANGLE_CLASSES.ACUTE;
            if (angle <= 95) return ANGLE_CLASSES.RIGHT;
            if (angle < 160) return ANGLE_CLASSES.OBTUSE;
            return ANGLE_CLASSES.STRAIGHT;
        }

        // Gerar um novo desafio
        function generateNewTarget() {
            const types = Object.values(ANGLE_CLASSES);
            // Escolhe um tipo aleatório
            const selectedType = types[Math.floor(Math.random() * types.length)];
            
            // Escolhe um valor específico dentro da faixa do tipo
            let specificAngle;
            if (selectedType.id === 'right') specificAngle = 90;
            else if (selectedType.id === 'straight') specificAngle = 180;
            else {
                // Aleatório dentro do range para agudo e obtuso
                specificAngle = Math.floor(Math.random() * (selectedType.max - selectedType.min)) + selectedType.min;
            }

            gameState.currentTarget = selectedType;
            gameState.targetAngleValue = specificAngle;
            gameState.holdFrames = 0;
            gameState.isPaused = false;

            // Atualiza UI
            uiElements.targetName.innerText = `Ângulo ${selectedType.name}`;
            uiElements.targetName.className = `text-3xl font-bold mb-2 ${selectedType.tailwind}`;
            uiElements.targetAngleText.innerText = `${specificAngle}°`;
            uiElements.targetAngleText.className = `text-4xl font-mono font-bold ${selectedType.tailwind}`;
            uiElements.successMessage.classList.add('hidden');
            uiElements.holdProgress.style.width = '0%';
            uiElements.holdProgress.className = `h-full transition-all duration-100 ease-linear bg-${selectedType.tailwind.split('-')[1]}-500`;

            drawTargetAngleCanvas(specificAngle, selectedType.color);
        }

        // Desenhar o ângulo alvo no canvas lateral
        function drawTargetAngleCanvas(angle, color) {
            const ctx = targetCtx;
            const cx = 100, cy = 100, radius = 60;
            ctx.clearRect(0, 0, 200, 200);

            // Linha base (0 graus)
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + radius, cy);
            ctx.strokeStyle = '#4b5563'; // gray-600
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Linha do ângulo
            const angleRad = -angle * (Math.PI / 180); // Negativo porque Y cresce pra baixo no canvas
            const endX = cx + radius * Math.cos(angleRad);
            const endY = cy + radius * Math.sin(angleRad);

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Arco indicativo
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.5, angleRad, 0, false);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Fundo do arco
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius * 0.5, angleRad, 0, false);
            ctx.fillStyle = color + '40'; // 25% opacity
            ctx.fill();
        }

        // Callback processando resultados do MediaPipe
        function onResults(results) {
            // Ajustar tamanho do canvas
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Espelhar contexto pois aplicamos transform: scaleX(-1) no CSS,
            // mas precisamos desenhar na posição correta da imagem raw
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                uiElements.cameraHint.classList.add('hidden'); // Esconde dica se detectou mão
                
                const landmarks = results.multiHandLandmarks[0]; // Pega a primeira mão
                
                // Pontos de interesse: 0 (Pulso), 4 (Ponta Polegar), 20 (Ponta Mindinho)
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const pinkyTip = landmarks[20];

                // Desenhar a mão sutilmente
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.2)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: 'rgba(255, 255, 255, 0.5)', lineWidth: 1, radius: 2});

                // Calcular Ângulo
                const p1 = { x: thumbTip.x * canvasElement.width, y: thumbTip.y * canvasElement.height };
                const vertex = { x: wrist.x * canvasElement.width, y: wrist.y * canvasElement.height };
                const p2 = { x: pinkyTip.x * canvasElement.width, y: pinkyTip.y * canvasElement.height };

                const currentAngle = calculateAngle(p1, vertex, p2);
                const currentClassification = classifyAngle(currentAngle);

                // Desenhar vetores fortes para o ângulo
                canvasCtx.beginPath();
                canvasCtx.moveTo(vertex.x, vertex.y);
                canvasCtx.lineTo(p1.x, p1.y);
                canvasCtx.moveTo(vertex.x, vertex.y);
                canvasCtx.lineTo(p2.x, p2.y);
                canvasCtx.strokeStyle = currentClassification.color;
                canvasCtx.lineWidth = 6;
                canvasCtx.lineCap = 'round';
                canvasCtx.lineJoin = 'round';
                canvasCtx.stroke();

                // Desenhar vértices principais
                [p1, vertex, p2].forEach(p => {
                    canvasCtx.beginPath();
                    canvasCtx.arc(p.x, p.y, 8, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = currentClassification.color;
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = '#fff';
                    canvasCtx.lineWidth = 2;
                    canvasCtx.stroke();
                });

                // Desenhar arco do ângulo
                let startAngle = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
                let endAngle = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
                
                // Garantir que desenhamos o menor arco
                let diff = endAngle - startAngle;
                while (diff <= -Math.PI) diff += 2 * Math.PI;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                endAngle = startAngle + diff;

                canvasCtx.beginPath();
                // Determina sentido do desenho para preencher o ângulo interno
                canvasCtx.arc(vertex.x, vertex.y, 50, startAngle, endAngle, diff < 0);
                canvasCtx.strokeStyle = currentClassification.color;
                canvasCtx.lineWidth = 3;
                canvasCtx.stroke();
                
                canvasCtx.lineTo(vertex.x, vertex.y);
                canvasCtx.fillStyle = currentClassification.color + '40'; // 25% opacity
                canvasCtx.fill();

                // Atualizar HUD
                uiElements.currentAngle.innerText = `${currentAngle}°`;
                uiElements.currentAngle.style.color = currentClassification.color;
                uiElements.currentClass.innerText = currentClassification.name;
                uiElements.currentClass.style.color = currentClassification.color;

                // Lógica de Sucesso
                if (!gameState.isPaused && gameState.currentTarget) {
                    // Verifica se está dentro da tolerância do alvo específico
                    const isMatch = Math.abs(currentAngle - gameState.targetAngleValue) <= gameState.tolerance;

                    if (isMatch) {
                        gameState.holdFrames++;
                        const progress = Math.min(100, (gameState.holdFrames / gameState.requiredHoldFrames) * 100);
                        uiElements.holdProgress.style.width = `${progress}%`;

                        if (gameState.holdFrames >= gameState.requiredHoldFrames) {
                            // SUCESSO!
                            gameState.isPaused = true;
                            uiElements.successMessage.classList.remove('hidden');
                            
                            // Aguarda 2 segundos e gera novo alvo
                            setTimeout(() => {
                                generateNewTarget();
                            }, 2000);
                        }
                    } else {
                        // Reseta progresso se sair da posição
                        gameState.holdFrames = Math.max(0, gameState.holdFrames - 2); // Decai rápido
                        uiElements.holdProgress.style.width = `${(gameState.holdFrames / gameState.requiredHoldFrames) * 100}%`;
                    }
                }
            } else {
                // Sem mãos
                uiElements.currentAngle.innerText = '--°';
                uiElements.currentClass.innerText = 'Mão não detectada';
                uiElements.currentClass.style.color = '#9ca3af';
                uiElements.cameraHint.classList.remove('hidden');
                
                if(!gameState.isPaused) {
                    gameState.holdFrames = 0;
                    uiElements.holdProgress.style.width = '0%';
                }
            }
            canvasCtx.restore();
        }

        // Inicializar Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Inicializar Câmera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        // Iniciar tudo
        camera.start().then(() => {
            // Ocultar loading e mostrar game area
            uiElements.loading.classList.add('hidden');
            uiElements.gameArea.classList.remove('hidden');
            uiElements.gameArea.classList.add('flex');
            
            // Iniciar primeiro alvo
            generateNewTarget();
        }).catch(err => {
            console.error(err);
            uiElements.loading.innerHTML = '<p class="text-red-500 font-bold">Erro ao acessar a câmera. Verifique as permissões.</p>';
        });

    </script>
</body>
</html>
