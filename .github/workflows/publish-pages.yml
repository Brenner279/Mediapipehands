name: Publicar Libras em Prática no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "README.md"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - "referencias-libras/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css README.md manifest.webmanifest service-worker.js _site/
          cp -R referencias-libras icons _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
