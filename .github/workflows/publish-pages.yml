name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "libras-em-pratica/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: node --check libras-em-pratica/app.js

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp -R index.html plano-cartesiano.html libras-em-pratica _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
